<!DOCTYPE html>
<html>
    <head>
        <title>pokedoro</title>
        <link rel = "stylesheet" href = "style.css">
    </head>
    <body>
        <h2>Pokedoro</h2>
        <p class = "subtitle">Lock-in to train your Pokemon</p>
        <div class = "main-container">
            <h2>Your Pokemon</h2>
            <div class = "pokemon-box">
                <img>
                <h2 id = "pokemonName">Charmander</h2>
                <p id = "pokemonLevel1">Level 1</p>
            </div>
            <div class = "xp-section">
                <p id = "xpText">0 / 100 XP</p>
                <div class = "xp-bar">
                    <div id = "xpProgress"></div>
                </div>
                <p id = "evolutionText">100 XP till evolution!!</p>
            </div>
            <hr>
            <h2>Study Timer</h2>
            <div class = "timer-modes">
                <button onclick = "setMode('study')">Study</button>
                <button onclick = "setMode('break')">Short Break</button>
            </div>
            <h1 id = "timer">25:00</h1>
            <div class = "timer-buttons">
                <button onclick = "starttimer()" id = "startButton">Start</button>
                <button onclick = "resetTimer()">Reset</button>
            </div>
            <p id = "status">Ready..?</p>
            <hr>
            <div class = "stats">
                <p>Total XP: <span id = "totalXP">0</span></p>
                <p>Sessions Completed: <span id = "sessions">0</span></p>
            </div>
        </div>
        <p class = "footer">Lock in to make this little guy a big Charizard</p>
        <script src = "script.js"></script>
    </body>
</html>
